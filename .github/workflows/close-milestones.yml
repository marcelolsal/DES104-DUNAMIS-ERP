name: Cerrar milestones al llegar a main

# Cuando un release entra a main (develop → main), todos los issues del sprint
# ya están cerrados (se cerraron al mergear a develop). Este workflow cierra
# automáticamente los milestones que quedaron sin issues abiertos, marcando
# "completado en producción". Ver decisión en el flujo GitFlow del proyecto.

on:
  push:
    branches: [main]

permissions:
  issues: write

jobs:
  cerrar-milestones-completos:
    runs-on: ubuntu-latest
    steps:
      - name: Cerrar milestones sin issues abiertos
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const milestones = await github.paginate(
              github.rest.issues.listMilestones,
              { owner, repo, state: "open", per_page: 100 },
            );
            for (const m of milestones) {
              const total = m.open_issues + m.closed_issues;
              if (total > 0 && m.open_issues === 0) {
                await github.rest.issues.updateMilestone({
                  owner,
                  repo,
                  milestone_number: m.number,
                  state: "closed",
                });
                core.info(`✔ Cerrado: "${m.title}" (#${m.number})`);
              } else {
                core.info(`· Sin cambios: "${m.title}" (abiertos: ${m.open_issues})`);
              }
            }
