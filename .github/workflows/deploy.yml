name: Deploy a producción (ordenado)

# Pipeline ordenado fail-fast que corre al mergear develop → main.
# Orden estricto (cada etapa espera a la anterior):
#   1. migrate         → migraciones Drizzle contra la Supabase de prod
#   2. deploy-backend  → deploy en Render y espera a que quede "live"
#   3. deploy-frontend → deploy en Vercel (producción)
#   4. close-milestones→ cierra los milestones ya completos
#
# Si una etapa falla, las siguientes NO corren (así el frontend no se actualiza
# contra un backend roto, etc.). Requiere que Render/Vercel tengan el auto-deploy
# APAGADO (render.yaml autoDeploy:false y vercel.json git.deploymentEnabled).
#
# Secrets necesarios (Settings → Secrets and variables → Actions):
#   PROD_DATABASE_URL · RENDER_API_KEY · RENDER_SERVICE_ID
#   VERCEL_TOKEN · VERCEL_ORG_ID · VERCEL_PROJECT_ID

on:
  push:
    branches: [main]
  # Manual (Actions → Deploy → Run workflow): corre TODAS las etapas.
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # 0) Detecta qué capas cambiaron para correr solo lo necesario.
  #    Cada etapa se activa con su flag; el orden y el fail-fast se preservan
  #    con `if: !failure() && !cancelled() && <flag>` (una etapa saltada NO es
  #    fallo, así la siguiente sí corre aunque la anterior se haya salteado).
  #    Push: compara contra el commit previo de main (`before`); sin `base`,
  #    paths-filter compara contra la rama por defecto (develop) → 0 cambios.
  #    Dispatch o `before` en ceros (rama nueva): el filtro no corre y el
  #    `|| 'true'` deja todas las etapas en true.
  detect:
    runs-on: ubuntu-latest
    outputs:
      migrations: ${{ steps.filter.outputs.migrations || 'true' }}
      backend: ${{ steps.filter.outputs.backend || 'true' }}
      frontend: ${{ steps.filter.outputs.frontend || 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        if: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' }}
        with:
          base: ${{ github.event.before }}
          filters: |
            migrations:
              - 'apps/backend/src/shared/db/migrations/**'
            backend:
              - 'apps/backend/**'
              - 'packages/contracts/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
            frontend:
              - 'apps/frontend/**'
              - 'packages/contracts/**'
              - 'pnpm-lock.yaml'
              - 'package.json'

  # 1) Migraciones — si fallan, se corta todo el pipeline.
  migrate:
    needs: detect
    if: ${{ !failure() && !cancelled() && needs.detect.outputs.migrations == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Aplicar migraciones a producción
        run: pnpm --filter @dunamis/backend db:migrate
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

  # 2) Backend — dispara el deploy en Render y espera a que quede "live".
  deploy-backend:
    needs: [detect, migrate]
    if: ${{ !failure() && !cancelled() && needs.detect.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy en Render y esperar
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          api="https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys"
          echo "Disparando deploy…"
          deploy_id=$(curl -fsS -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            "$api" -d '{"clearCache":"do_not_clear"}' | jq -r '.id')
          echo "Deploy id: $deploy_id"
          for _ in $(seq 1 90); do
            status=$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
              "$api/$deploy_id" | jq -r '.status')
            echo "estado: $status"
            case "$status" in
              live) echo "✅ backend live"; exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "❌ deploy falló ($status)"; exit 1 ;;
            esac
            sleep 10
          done
          echo "⏱️ timeout esperando a Render"; exit 1

  # 3) Frontend — deploy a Vercel (producción). El CLI espera y falla si rompe.
  deploy-frontend:
    needs: [detect, deploy-backend]
    if: ${{ !failure() && !cancelled() && needs.detect.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # vercel build corre pnpm install (monorepo)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy en Vercel (producción)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          npm i -g vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  # 4) Milestones — al final. Si no se cierran, no es crítico.
  close-milestones:
    needs: [detect, deploy-frontend]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const milestones = await github.paginate(
              github.rest.issues.listMilestones,
              { owner, repo, state: "open", per_page: 100 },
            );
            for (const m of milestones) {
              const total = m.open_issues + m.closed_issues;
              if (total > 0 && m.open_issues === 0) {
                await github.rest.issues.updateMilestone({
                  owner, repo, milestone_number: m.number, state: "closed",
                });
                core.info(`✔ Cerrado: "${m.title}" (#${m.number})`);
              } else {
                core.info(`· Sin cambios: "${m.title}" (abiertos: ${m.open_issues})`);
              }
            }
